# Nginx Reverse Proxy Configuration for https://www.dpokmm.panchayatautomation.in/psdata
# Place in /etc/nginx/sites-available/dpokmm.panchayatautomation.in

server {
    listen 80;
    server_name dpokmm.panchayatautomation.in www.dpokmm.panchayatautomation.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dpokmm.panchayatautomation.in www.dpokmm.panchayatautomation.in;

    # SSL Certificate configuration (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/dpokmm.panchayatautomation.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dpokmm.panchayatautomation.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max body upload size for Excel imports & documents (15MB)
    client_max_body_size 15M;

    # Primary Subpath: https://www.dpokmm.panchayatautomation.in/psdata
    location /psdata {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Redirect root to /psdata if desired, or serve directly
    location = / {
        return 301 https://$host/psdata;
    }

    # Fallback proxy for all other requests
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
